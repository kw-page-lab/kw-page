<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>KimeraWare</title>
    <script>
      const pathSegmentsToKeep = 0;
      const location = window.location;
      const redirect = location.href.split('?')[0].split('#')[0];
      const segments = location.pathname.slice(1).split('/');
      
      location.replace(
        location.protocol + '//' + location.hostname + 
        (location.port ? ':' + location.port : '') +
        '/' +
        (segments.length > pathSegmentsToKeep 
          ? '?p=/' + segments.slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~')
          : '') +
        (location.search ? '&q=' + location.search.slice(1).replace(/&/g, '~and~') : '') +
        location.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
