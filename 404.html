<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>KimeraWare</title>
    <script>
      const pathSegmentsToKeep = 0;
      const currentLoc = window.location;
      const redirect = currentLoc.href.split('?')[0].split('#')[0];
      const segments = currentLoc.pathname.slice(1).split('/');
      
      location.replace(
        currentLoc.protocol + '//' + currentLoc.hostname +
        (currentLoc.port ? ':' + currentLoc.port : '') +
        '/' +
        (segments.length > pathSegmentsToKeep
          ? '?p=/' + segments.slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~')
          : '') +
        (currentLoc.search ? '&q=' + currentLoc.search.slice(1).replace(/&/g, '~and~') : '') +
        currentLoc.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
