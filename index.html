<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KimeraWare Fansite by MetaCodeX">
  <title>KimeraWare</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
  <style>
    @font-face {
      font-family: 'SLNTHLN';
      src: url('/SLNTHLN.TTF') format('truetype');
      font-weight: 100 900;
      font-style: normal;
    }

    #top-overlay {
      position: fixed;
      top: 3.5vh;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      user-select: none;
      z-index: 10;
      width: 90vw;
      max-width: 1200px;
      display: flex;
      justify-content: center;
    }

    #top-tagline {
      color: rgba(255, 255, 255, 0.85);
      font-family: 'Outfit', sans-serif;
      font-size: clamp(10px, 1.5vw, 15px);
      font-weight: 200;
      letter-spacing: 5px;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      text-transform: uppercase;
      white-space: nowrap;
      margin: 0;
    }

    #loading-splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #030303;
      transition: opacity 0.8s ease-out;
    }

    #loading-splash.done {
      animation: loading-fade 800ms ease-out forwards;
    }

    .loading-logo {
      font-size: clamp(18px, 3.5vw, 32px);
      font-weight: 300;
      letter-spacing: 8px;
      color: #ffffff;
      animation: loading-pulse 2s ease-in-out infinite;
      font-family: SLNTHLN, Arial, sans-serif;
      margin-bottom: 1.5rem;
    }

    .loading-bar-track {
      width: 180px;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    #loading-bar-fill {
      height: 100%;
      width: 0%;
      background: #3b82f6;
      box-shadow: 0 0 8px #3b82f6;
      transition: width 0.4s cubic-bezier(0.1, 0.8, 0.2, 1);
    }

    #loading-text {
      margin-top: 1rem;
      font-family: SLNTHLN, Arial, sans-serif;
      font-size: 10px;
      font-weight: 200;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
    }

    @keyframes loading-fade {
      0% { opacity: 1; }
      100% { opacity: 0; pointer-events: none; }
    }

    @keyframes loading-pulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    #kw-overlay {
      position: fixed;
      bottom: 2.2vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4em;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }

    #kw-overlay a {
      pointer-events: auto;
      display: inline-block;
      line-height: 0;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #kw-logo {
      width: clamp(110px, 16vw, 240px);
      height: auto;
      opacity: 0.75;
      filter: drop-shadow(0 0 10px rgba(160, 200, 255, 0.50))
              drop-shadow(0 0 3px  rgba(160, 200, 255, 0.30));
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #kw-overlay a:hover #kw-logo {
      opacity: 0.95;
    }

    #kw-overlay a:hover {
      transform: scale(1.03);
    }

    #kw-tagline {
      color: #fff;
      font-family: SLNTHLN, Arial, sans-serif;
      font-size: clamp(13px, 2.2vw, 22px);
      font-weight: 100;
      font-synthesis: none;
      letter-spacing: 3px;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
      white-space: nowrap;
      margin: 0;
      opacity: 0.80;
    }

    @media (max-width: 768px) {
      #top-overlay {
        top: 2vh;
        width: 92vw;
      }
      #top-tagline {
        font-size: clamp(10px, 3.2vw, 13px);
        letter-spacing: 3px;
        white-space: normal;
        line-height: 1.5;
      }
      #kw-overlay {
        bottom: 2.5vh;
        gap: 0.2em;
      }
      #kw-tagline {
        font-size: clamp(11px, 4vw, 16px);
        letter-spacing: 2px;
      }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="loading-logo">CARGANDO...</div>
    <div class="loading-bar-track">
      <div id="loading-bar-fill"></div>
    </div>
    <p id="loading-text">Iniciando...</p>
  </div>

  <main id="app-container">
    <h1 class="visually-hidden">Escena Interactiva 3D con Foco de Luz y Shaders de Oscuridad</h1>
    <canvas id="webgl-canvas" aria-label="Escena 3D interactiva"></canvas>
  </main>

  <div id="top-overlay">
    <p id="top-tagline">DONDE LA REALIDAD SE DISTORSIONA, EL JUEGO COMIENZA.</p>
  </div>

  <div id="kw-overlay">
    <a href="https://www.youtube.com/@Kimeraware" target="_blank" rel="noopener noreferrer">
      <img id="kw-logo" src="/logo.png" alt="Kimeraware" draggable="false">
    </a>
    <p id="kw-tagline">PROXIMAMENTE...</p>
  </div>

  <script type="module" src="/src/main.js"></script>
  <!-- Fun is Infinite with Sega Enterprises (1/7) -->
</body>
</html>
